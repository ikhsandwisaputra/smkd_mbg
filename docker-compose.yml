version: '3.8'

services:
  db:
    image: postgres:16
    container_name: postgres_16_container
    restart: always
    environment:
      POSTGRES_USER: user_fastapi
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: db_belajar
    ports:
      - "5432:5432"  # Mapping port agar bisa diakses DBeaver & Localhost
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: